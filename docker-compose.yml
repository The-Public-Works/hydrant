services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hydrant-postgres
    environment:
      POSTGRES_USER: ctx
      POSTGRES_DB: ctx
      POSTGRES_PASSWORD: ctx
    volumes:
      - ctx-postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctx"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 256m
    shm_size: 256m

  # Pitch website + product demo (Next.js).
  # Routes:
  #   /          marketing landing
  #   /present   slide deck (use ?speaker_notes=true for presenter view)
  #   /demo      Hydrant chat + graph (proxies /api/* to the api service)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hydrant-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    # Note: /demo proxies /api/* to localhost:8765 (the FastAPI backend).
    # When we dockerize `api/` later we'll add a depends_on + an env var
    # to rewrite the proxy target to `http://api:8765`. For now run the
    # api locally (`python -m api`) and host.docker.internal:8765 from
    # the container — or just use /, /present which need no backend.

volumes:
  ctx-postgres-data:
