services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ctx-postgres
    environment:
      POSTGRES_USER: ctx
      POSTGRES_DB: ctx
      POSTGRES_PASSWORD: ctx
    volumes:
      - ctx-postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctx"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 256m
    shm_size: 256m

volumes:
  ctx-postgres-data:
