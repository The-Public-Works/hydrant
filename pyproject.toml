[project]
name = "hydrant"
version = "0.1.0"
description = "Intelligent Context Navigation: a knowledge-graph + semantic-search MCP server over a GitHub repo."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["indexer*", "mcp_server*", "api*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
