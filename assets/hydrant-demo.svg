<!--
  Animated demo asset — a terminal-style tool stream that auto-replays
  the key moments of a real Hydrant run. Same events as the SeeItRun
  section of the landing page, condensed to 9 lines over a 12-second
  loop so the visual is digestible at README-thumbnail size.

  Uses SMIL <animate> rather than CSS keyframes because GitHub's image
  proxy strips embedded <style> blocks but renders SMIL inline. Each
  line opacity-fades in at its keyTime, then stays visible until the
  loop restarts.

  Want to swap this for a real screen-recording GIF later? Two paths:
    1. macOS — record the SeeItRun panel on the live site (or
       /present slide 6) with Cmd+Shift+5, then convert MOV → GIF
       with `ffmpeg -i in.mov -vf "fps=15,scale=900:-1:flags=lanczos"
       -loop 0 hydrant-demo.gif`
    2. Use the existing Google Drive demo video, trim to ~10s, same
       ffmpeg recipe.
  Drop the resulting hydrant-demo.gif next to this file and swap the
  <img src=> in README.md.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 900 360"
  role="img"
  aria-label="Hydrant in action — one prompt, two-minute diagnosis with cited sources"
>
  <title>Hydrant in action — one prompt, two-minute diagnosis</title>

  <!-- Terminal window background -->
  <rect width="900" height="360" rx="14" fill="#0F172A" />

  <!-- Window chrome (red/amber/emerald traffic lights + label) -->
  <g transform="translate(20 22)">
    <circle cx="6"  cy="0" r="6" fill="#EF4444" />
    <circle cx="26" cy="0" r="6" fill="#FBBF24" />
    <circle cx="46" cy="0" r="6" fill="#10B981" />
    <text
      x="72"
      y="4"
      font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace"
      font-size="12"
      fill="#94A3B8"
    >hydrant · tool stream</text>
    <text
      x="880"
      y="4"
      text-anchor="end"
      font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace"
      font-size="11"
      fill="#64748B"
    >9/9 events</text>
  </g>

  <!-- Divider under chrome -->
  <line x1="0" y1="48" x2="900" y2="48" stroke="#1E293B" stroke-width="1" />

  <!-- Tool stream lines — each fades in at its own keyTime within a
       12-second loop. The animation values "0;0;1;1" with keyTimes
       at "0; (when-to-show); (when-to-show + tiny epsilon); 1" gives
       a clean cut-in rather than a long fade. -->

  <g
    font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace"
    font-size="14"
  >
    <!-- Line 1: incident detected (system, amber) -->
    <text x="24" y="84" fill="#FCD34D" font-style="italic" opacity="0">
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.04;1" dur="12s" repeatCount="indefinite" />
      [  0s]  Incident detected — #incident-auth-401s
    </text>

    <!-- Line 2: agent received prompt (system, amber) -->
    <text x="24" y="112" fill="#FCD34D" font-style="italic" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.10;0.11;1" dur="12s" repeatCount="indefinite" />
      [  2s]  Your agent received the prompt — reading runbook
    </text>

    <!-- Line 3: call mcp.diagnose_incident (call, green) -->
    <text x="24" y="140" fill="#34D399" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.18;0.19;1" dur="12s" repeatCount="indefinite" />
      [ 15s]  mcp.diagnose_incident("Auth 401s after deploy")
    </text>

    <!-- Line 4: result (slate, indented) -->
    <text x="60" y="168" fill="#CBD5E1" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.29;1" dur="12s" repeatCount="indefinite" />
      6 similar incidents · 2 runbook hits · owner @chetan  (8.4 s)
    </text>

    <!-- Line 5: call mcp.get_pr_diff -->
    <text x="24" y="196" fill="#34D399" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.38;0.39;1" dur="12s" repeatCount="indefinite" />
      [ 40s]  mcp.get_pr_diff(#2)
    </text>

    <!-- Line 6: result -->
    <text x="60" y="224" fill="#CBD5E1" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.48;0.49;1" dur="12s" repeatCount="indefinite" />
      src/config/config.js — default(30) → default(0)  (4.2 s)
    </text>

    <!-- Line 7: call mcp.create_linear_issue -->
    <text x="24" y="252" fill="#34D399" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.58;0.59;1" dur="12s" repeatCount="indefinite" />
      [ 88s]  mcp.create_linear_issue("Auth 401s — JWT expiry")
    </text>

    <!-- Line 8: result CLI-36 opened -->
    <text x="60" y="280" fill="#CBD5E1" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.68;0.69;1" dur="12s" repeatCount="indefinite" />
      CLI-36 opened ↗
    </text>

    <!-- Line 9: final done (system, brand red) -->
    <text x="24" y="312" fill="#F87171" font-weight="600" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.78;0.79;1" dur="12s" repeatCount="indefinite" />
      [113s]  ✓ Synthesis posted to #incident-channel — whole team has context.
    </text>
  </g>
</svg>
