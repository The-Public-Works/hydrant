<!--
  Hydrant brand mark — red rounded square with a white flame.

  Identical geometry to frontend/app/icon.svg (the site favicon) so
  the brand stays consistent across surfaces: GitHub README header,
  social cards, slide decks, terminal recordings, etc.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  role="img"
  aria-label="Hydrant"
>
  <title>Hydrant</title>
  <rect width="64" height="64" rx="14" fill="#DC2626" />
  <g
    transform="translate(8 8) scale(2)"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" />
  </g>
</svg>
