<!--
  The Public Works — horizontal lockup (mark + wordmark)

  Same Π proportions as the primary square mark (assets/the-public-works-mark.svg)
  so the icon stays visually consistent across all surfaces.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 520 120"
  role="img"
  aria-label="The Public Works — open-source studio"
>
  <title>The Public Works</title>

  <!-- Icon mark, vertically centred -->
  <g transform="translate(8 28)">
    <rect width="64" height="64" rx="10" fill="#0F172A" />
    <rect x="6" y="12" width="52" height="10" rx="2" fill="#FFFFFF" />
    <rect x="11" y="22" width="13" height="34" rx="2" fill="#FFFFFF" />
    <rect x="40" y="22" width="13" height="34" rx="2" fill="#FFFFFF" />
  </g>

  <!-- Wordmark -->
  <text
    x="92"
    y="62"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-weight="800"
    font-size="34"
    letter-spacing="-0.02em"
    fill="#0F172A"
  >The Public Works</text>

  <!-- Kicker / tagline -->
  <text
    x="92"
    y="86"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-weight="600"
    font-size="13"
    letter-spacing="0.18em"
    fill="#64748B"
  >OPEN-SOURCE STUDIO · EST. 2026</text>
</svg>
