<!--
  Hydrant horizontal lockup — icon mark + wordmark + tagline.

  Use this in README headers, slide decks, and anywhere the logo
  needs to live alongside the product name. The square mark on its
  own (assets/hydrant-mark.svg) is the preferred form for avatars
  and favicons.

  Typography uses the Inter / system-ui fallback so the SVG renders
  consistently across GitHub, browsers, and most CI tools without
  needing to embed a webfont.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 520 120"
  role="img"
  aria-label="Hydrant — incident knowledge on demand"
>
  <title>Hydrant</title>

  <!-- Icon mark on the left -->
  <g transform="translate(8 28)">
    <rect width="64" height="64" rx="14" fill="#DC2626" />
    <g
      transform="translate(8 8) scale(2)"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="2.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" />
    </g>
  </g>

  <!-- Wordmark -->
  <text
    x="92"
    y="64"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-weight="800"
    font-size="40"
    letter-spacing="-0.02em"
    fill="#0F172A"
  >Hydrant</text>

  <!-- Tagline -->
  <text
    x="92"
    y="88"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-weight="600"
    font-size="12"
    letter-spacing="0.22em"
    fill="#64748B"
  >INCIDENT KNOWLEDGE · ON DEMAND</text>
</svg>
