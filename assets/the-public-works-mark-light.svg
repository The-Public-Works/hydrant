<!--
  The Public Works — inverted mark (light on dark)

  Same geometry as the primary mark, but with the colours flipped so the
  logo reads cleanly on dark backgrounds (dark-mode README hero, terminal
  recordings, slide decks, etc.).
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  role="img"
  aria-label="The Public Works"
>
  <title>The Public Works</title>
  <rect width="64" height="64" rx="10" fill="#FFFFFF" />
  <rect x="6" y="12" width="52" height="10" rx="2" fill="#0F172A" />
  <rect x="11" y="22" width="13" height="34" rx="2" fill="#0F172A" />
  <rect x="40" y="22" width="13" height="34" rx="2" fill="#0F172A" />
</svg>
